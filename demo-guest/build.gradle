plugins { id 'com.android.application' }
android {
    namespace 'dev.zips.clientbase.guest'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.zips.clientbase.guest'
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':contract')
    // AppCompat's transitive Kotlin libraries must agree after stdlib merged jdk7/8.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
