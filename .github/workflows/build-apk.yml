name: Build APK
on:
  workflow_dispatch:
    inputs:
      emulator_tests:
        description: Run hosting checks on an Android 13 emulator
        type: boolean
        default: true
  push:
    paths: ['host/**', 'demo-guest/**', 'contract/**', 'gradle/**', 'gradlew*', '*.gradle', 'gradle.properties', '.github/workflows/build-apk.yml', 'tools/**']
  pull_request:
    paths: ['host/**', 'demo-guest/**', 'contract/**', 'gradle/**', 'gradlew*', '*.gradle', 'gradle.properties', '.github/workflows/build-apk.yml', 'tools/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Locate hosted Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Free unused hosted NDK versions
        run: |
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          for directory in "$ANDROID_HOME"/ndk/*; do
            if [ -d "$directory" ] && [ "$(basename "$directory")" != 27.2.12479018 ]; then
              sudo rm -rf -- "$directory"
            fi
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          df -h "$ANDROID_HOME"
      - name: Install pinned Android tools
        run: |
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses > /dev/null
          if ! sdkmanager --verbose 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' > sdk-install.log 2>&1; then
            df -h "$ANDROID_HOME" | sed 's/^/::error::SDK disk: /'
            grep -iE 'error|exception|failed|warning|space' sdk-install.log | tail -n 15 | sed 's/^/::error::SDK diagnostic: /' || true
            tail -n 15 sdk-install.log | sed 's/^/::error::SDK setup: /'
            exit 1
          fi
          cat sdk-install.log
      - name: Source and native identity checks
        run: python3 tools/test_client_base.py
      - name: Build host, guest and device tests
        run: ./gradlew :host:assembleDebug :demo-guest:assembleDebug :host:assembleDebugAndroidTest --stacktrace
      - name: Collect installable APKs
        run: |
          mkdir -p build/apks
          cp host/build/outputs/apk/debug/host-debug.apk build/apks/client-base-host-debug.apk
          cp demo-guest/build/outputs/apk/debug/demo-guest-debug.apk build/apks/client-base-demo-debug.apk
          cp host/build/outputs/apk/androidTest/debug/host-debug-androidTest.apk build/apks/client-base-tests.apk
          python3 - <<'PYAPK'
          import pathlib, zipfile
          for apk in pathlib.Path('build/apks').glob('*.apk'):
              with zipfile.ZipFile(apk) as archive:
                  forbidden = [name for name in archive.namelist()
                               if 'libminecraftpe' in name.lower() or name.lower().endswith('.7z')]
                  assert not forbidden, (apk, forbidden)
          PYAPK
          (cd build/apks && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: client-base-debug-${{ github.run_number }}
          path: build/apks/
          if-no-files-found: error
      - name: Enable emulator KVM
        if: github.event_name != 'workflow_dispatch' || inputs.emulator_tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 integration tests
        if: github.event_name != 'workflow_dispatch' || inputs.emulator_tests
        run: bash tools/emulator_checks.sh
      - name: Device test reports
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.emulator_tests)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: client-base-device-tests-${{ github.run_number }}
          path: |
            host/build/reports/androidTests/
            host/build/outputs/androidTest-results/
            emulator.log
            emulator-install.log
            sdk-install.log
            device-tests.log
          if-no-files-found: warn
